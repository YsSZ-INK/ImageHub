name: Build & Push Docker Image

# 推送到 main 或 final-review 时自动构建镜像并发布到 ghcr.io
on:
  push:
    branches: [main, final-review]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 内联缓存：发布镜像自带缓存清单，后续构建直接从 ghcr 复用层缓存（registry 缓存）
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          # 缓存来源：registry（latest 镜像内联缓存）优先，GHA 缓存兜底
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:latest
            type=gha
          cache-to: type=inline

      # 只清理 7 天前的构建缓存，避免 builder 缓存无限堆积
      - name: Prune build cache older than 7 days
        if: always()
        run: docker builder prune --filter until=168h -f
