# Docker Compose：web + postgres（本地磁盘存储）
# 可选扩展：--profile redis 启用 Redis（默认内存限流，单实例足够）
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imagehub
      POSTGRES_PASSWORD: imagehub-pass-change-me
      POSTGRES_DB: imagehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- 可选：Redis（docker compose --profile redis up -d） ----
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # 优先使用 ghcr.io 上的成品镜像（GitHub Actions 自动构建）；本地无镜像时用 build 构建
    image: ghcr.io/yszz-ink/imagehub:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me-32chars-minimum}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://imagehub:imagehub-pass-change-me@postgres:5432/imagehub
      LOCAL_STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: "20"
      CONVERT_TO_WEBP: "false"
      # 留空时限流降级为进程内存实现；启用 Redis 时在 .env 设 REDIS_URL
      REDIS_URL: ${REDIS_URL:-}

volumes:
  postgres_data:
  storage_data:
  redis_data:
