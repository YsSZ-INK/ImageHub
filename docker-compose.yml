# Docker Compose：web + postgres（本地磁盘存储）
# Redis 可选启用：.env 设 REDIS_URL=redis://redis:6379 后 docker compose --profile redis up -d
# 不启用时限流自动降级进程内存（单实例足够）
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imagehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imagehub-pass-change-me}
      POSTGRES_DB: imagehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- 可选：Redis（.env 设 REDIS_URL 后 docker compose --profile redis up -d 启用） ----
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # 优先使用 ghcr.io 上的成品镜像（GitHub Actions 自动构建）；本地无镜像时用 build 构建
    image: ghcr.io/yssz-ink/imagehub:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 默认仅绑定本机回环 127.0.0.1：端口不出主机，外网无法直连（Docker 发布端口不走系统防火墙，只能靠绑定地址控制）
      # 需要外网直接访问时在 .env 设 BIND_IP=0.0.0.0（建议同时用防火墙/安全组限制来源）；反代场景保持默认即可
      - "${BIND_IP:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # AUTH_SECRET 必须由部署方显式提供（公开缺省值等于人人可伪造会话），缺失时 compose 直接报错退出，
      # 强制在 .env 中生成真实密钥
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET（执行 openssl rand -base64 32 生成）}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://imagehub:${POSTGRES_PASSWORD:-imagehub-pass-change-me}@postgres:5432/imagehub
      LOCAL_STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-512}"
      CONVERT_TO_WEBP: "${CONVERT_TO_WEBP:-false}"
      # 默认留空 = 不启用 Redis（限流走进程内存）；启用时在 .env 设 REDIS_URL=redis://redis:6379
      # 并用 docker compose --profile redis up -d 启动；也可在站点设置里随时改地址（无需重启）
      REDIS_URL: ${REDIS_URL:-}
      # 反代部署时在 .env 设 TRUST_PROXY=1：限流按真实客户端 IP 计数（默认不信任代理头，防伪造轮换绕过）
      TRUST_PROXY: ${TRUST_PROXY:-}
      # 可选首注册门控——设置后，空库状态下的首次注册（将自动成为超级管理员）
      # 必须在请求体携带一致的 setupToken 字段，防止公网部署后注册入口被陌生人抢先占用；留空不启用
      SETUP_TOKEN: ${SETUP_TOKEN:-}

volumes:
  postgres_data:
  storage_data:
  redis_data:
