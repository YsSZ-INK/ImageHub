# Docker Compose：web + postgres + minio + redis
# MinIO 桶默认私有 —— 符合"严格私有、禁止公开读"的要求
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imagehub
      POSTGRES_PASSWORD: imagehub-pass-change-me
      POSTGRES_DB: imagehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-change-me
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 控制台（仅管理用途，生产建议关闭）
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 初始化 MinIO 桶（私有，不设公开读策略）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin-change-me &&
      mc mb --ignore-existing local/imagehub &&
      echo 'MinIO 桶 imagehub 已创建（默认私有，无公开读策略）'"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # 优先使用 ghcr.io 上的成品镜像（GitHub Actions 自动构建）；本地无镜像时用 build 构建
    image: ghcr.io/yszz-ink/imagehub:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me-32chars-minimum}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://imagehub:imagehub-pass-change-me@postgres:5432/imagehub
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: imagehub
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin-change-me
      MAX_UPLOAD_MB: "20"
      CONVERT_TO_WEBP: "false"
      REDIS_URL: redis://redis:6379

volumes:
  postgres_data:
  minio_data:
  redis_data:
